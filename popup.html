<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat Custom</title><link rel="stylesheet" href="popup.css"></head><body><main class="panel"><header class="brand"><img src="logo.svg" alt="Chat Custom" class="brand-logo"></header><section class="section"><h2>Page background</h2><label class="field"><span>Background type</span><select id="mode"><option value="default">Default</option><option value="image">Custom image</option><option value="color">Solid color</option></select></label><label class="field" id="imageField"><span>Choose an image</span><input id="image" type="file" accept="image/*"><small>Images are resized before being saved locally.</small></label><label class="field" id="colorField"><span>Background color</span><input id="color" type="color" value="#171923"></label><label class="field"><span>Image fit</span><select id="fit"><option value="cover">Cover</option><option value="contain">Contain</option><option value="auto">Center (original size)</option></select></label><label class="field"><span>Image position</span><select id="position"><option value="center">Center</option><option value="top">Top</option><option value="bottom">Bottom</option><option value="left">Left</option><option value="right">Right</option></select></label><label class="field"><span>Background opacity <output id="opacityValue">100%</output></span><input id="opacity" type="range" min="0" max="100" value="100"></label><button id="reset" class="secondary" type="button">Revert to default</button><p id="status" role="status" aria-live="polite"></p></section><footer>Settings are saved on this device.</footer></main><script src="popup.js"></script></body></html>
